<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pen Plotter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 800px; }
    h1 { margin-bottom: 1rem; }
    .row { margin-bottom: 1rem; }
    textarea { width: 100%; height: 240px; font-family: monospace; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #downloadBtn { display: none; margin-left: 0.5rem; }
    #status { font-weight: bold; }
  </style>
</head>
<body>
  <h1>AI Pen Plotter</h1>

  <div class="row">
    <input id="imageInput" type="file" accept="image/*">
  </div>

  <div class="row">
    <button id="processBtn">Process &amp; Generate G-code</button>
    <a id="downloadBtn" href="/download"><button type="button">Download G-code</button></a>
  </div>

  <div class="row">
    Status: <span id="status">Idle</span>
  </div>

  <div class="row">
    <textarea id="preview" placeholder="G-code preview will appear here..." readonly></textarea>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const processBtn = document.getElementById("processBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");
    const previewEl = document.getElementById("preview");

    processBtn.addEventListener("click", async () => {
      if (!imageInput.files || imageInput.files.length === 0) {
        statusEl.textContent = "Please choose an image first.";
        return;
      }

      const formData = new FormData();
      formData.append("image", imageInput.files[0]);

      statusEl.textContent = "Uploading image...";
      previewEl.value = "";
      downloadBtn.style.display = "none";
      processBtn.disabled = true;

      try {
        statusEl.textContent = "Processing full pipeline...";
        const response = await fetch("/process", {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || "Processing failed");
        }

        previewEl.value = data.gcode_preview || "";
        statusEl.textContent = "Done";
        downloadBtn.style.display = "inline";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
